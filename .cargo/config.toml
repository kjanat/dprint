# :schema https://www.schemastore.org/cargo-config.json

[alias]
build-kprint = "build -p kprint --release --bin kprint"
lint         = "clippy --workspace --all-features --all-targets"
run-kprint   = "run -qp kprint --release --bin kprint --"

[build]
rustflags = "-Dwarnings"

[target]
# statically link the c runtime https://github.com/rust-lang/rust/issues/100874
'cfg(all(windows, target_env = "msvc"))'.rustflags = ["-C", "target-feature=+crt-static"]
