lint:
  rules:
    security:
      cache-call-unrestricted:
        options: null
        level: on
      cache-write-untrusted:
        options: null
        level: on
    correctness:
      cache-operation:
        options: null
        level: on
    policy:
      disallow-suppressions:
        options: null
        level: on
      require-commit-hash:
        options: null
        level: on
      require-job-timeout:
        options: null
        level: on
      require-permissions:
        options: null
        level: on
plugins:
    - shellcheck
    - ruff
