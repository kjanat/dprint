    needs: [changes, format, library_boundaries, prepare_release, build, release_checksums]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env: { code: "${{ case(contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure'), '1', '0') }}" }
    steps: [run: 'exit "${code}"']
  release_checksums:
    name: Finalize available release assets
    concurrency:
      group: "release-assets-${{ needs.changes.outputs.release_tag }}"
      cancel-in-progress: false
    needs: [changes, prepare_release, build]
    if: >-
      always() && !cancelled() && needs.changes.outputs.release == 'true' &&
      needs.prepare_release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: release-assets
      - name: Calculate checksums of available binaries
        working-directory: release-assets
        run: |
          shopt -s nullglob
          files=(dprint-*.zip)
          if (( ${#files[@]} == 0 )); then
            echo 'No release binaries were uploaded.' >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHASUMS256.txt
      - name: Upload available binaries
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          RELEASE_TAG: "${{ needs.changes.outputs.release_tag }}"
        run: gh release upload "${RELEASE_TAG}" release-assets/dprint-*.zip --clobber
      - name: Update checksums for the complete release
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          RELEASE_TAG: "${{ needs.changes.outputs.release_tag }}"
        run: |
          gh release view "${RELEASE_TAG}" --json assets > release-assets.json
          jq -er '
            [.assets[] | select(.name | startswith("dprint-") and endswith(".zip"))] | sort_by(.name) |
            if length == 0 then error("No release binaries") else .[] end |
            if (.digest // "" | test("^sha256:[a-f0-9]{64}$")) then
              "\(.digest[7:])  \(.name)"
            else error("Missing SHA-256 digest for " + .name) end
          ' release-assets.json > SHASUMS256.txt
          gh release upload "${RELEASE_TAG}" SHASUMS256.txt --clobber
