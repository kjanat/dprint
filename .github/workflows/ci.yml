name: CI
on:
  push:
    branches: [master]
    tags: ["*"]
    paths-ignore:
      - .github/*
      - deployment/**
      - website/**
  # every pull request, so a stacked one (based on another's branch) is tested too
  pull_request:
permissions: { contents: read }
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { pull-requests: read }
    outputs: { code: "${{ steps.filter.outputs.code }}" }
    steps:
      - id: filter
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ github.event.pull_request.number }}"
        run: |-
          code=true
          if [[ -n "${PR}" ]]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
            grep -qvE '^(\.github/[^/]+|deployment/.+|website/.+)$' <<< "${files}" || code=false
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
  format:
    name: Check formatting
    needs: changes
    if: needs.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      LZMA_API_STATIC: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: kjanat/dprint-check@2a71b9c51a4bd9935243a16de38fa830dbaa30be # v3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { key: format }
      - name: Check formatting with the current source
        run: cargo run -p dprint --locked -- check
  library_boundaries:
    name: Library boundaries
    needs: changes
    if: needs.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { key: libraries }
      - name: Check independent libraries
        run: |-
          for package in dprint-configuration dprint-formatting dprint-async-runtime dprint-communication dprint-owned-child dprint-plugin-types dprint-process-plugin dprint-wasm-plugin; do
            cargo check --locked -p "${package}"
          done
      - name: Check facade feature combinations
        run: |-
          for features in '' formatting tracing wasm process communication async_runtime process,wasm,tracing; do
            cargo test --locked -p dprint-core --no-default-features --features "${features}"
          done
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build renamed Wasm API and facade fixtures
        env: { RUSTFLAGS: "-C link-arg=--allow-undefined" }
        run: |-
          for feature in direct facade; do
            cargo build --manifest-path crates/dprint-core/tests/fixtures/wasm-plugin/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "${feature}"
          done
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: "${{ matrix.target }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            run_tests: "true"
            target: x86_64-apple-darwin
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: x86_64-apple-darwin
          - os: macOS-latest
            run_tests: "true"
            target: aarch64-apple-darwin
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: aarch64-apple-darwin
          - os: windows-latest
            run_tests: "true"
            target: x86_64-pc-windows-msvc
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            run_tests: "true"
            target: aarch64-pc-windows-msvc
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            run_tests: "true"
            target: x86_64-unknown-linux-gnu
            cross: "false"
            musl_image: ""
            zigbuild_glibc: "2.17"
            cargo: cargo-zigbuild
            cargo_target: x86_64-unknown-linux-gnu.2.17
          - os: ubuntu-22.04
            run_tests: "false"
            target: x86_64-unknown-linux-musl
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            run_tests: "true"
            target: aarch64-unknown-linux-gnu
            cross: "false"
            musl_image: ""
            zigbuild_glibc: "2.17"
            cargo: cargo-zigbuild
            cargo_target: aarch64-unknown-linux-gnu.2.17
          - os: ubuntu-24.04-arm
            run_tests: "false"
            target: aarch64-unknown-linux-musl
            cross: "false"
            musl_image: ""
            zigbuild_glibc: ""
            cargo: cargo
            cargo_target: aarch64-unknown-linux-musl
          - os: ubuntu-22.04
            run_tests: "false"
            target: riscv64gc-unknown-linux-gnu
            cross: "true"
