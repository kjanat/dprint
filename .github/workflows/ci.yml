  build_freebsd:
    name: x86_64-unknown-freebsd
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      ZIP_CHECKSUM: "${{ steps.package.outputs.ZIP_CHECKSUM }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          arch: x86_64
          mem: 8192
          cpu: 2
          prepare: |-
            set -eu
            pkg install -y curl git pkgconf
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          run: |-
            set -eu
            export PATH="${HOME}/.cargo/bin:${PATH}"
            export CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 RUST_BACKTRACE=full LZMA_API_STATIC=1
            target=x86_64-unknown-freebsd
            : "${GITHUB_REF:?}"
            # Honor rust-toolchain.toml, including its pinned compiler version.
            rustup show active-toolchain
            if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
              cargo build -p dprint -p test-process-plugin --locked --target "${target}" --release
              cargo test --locked --target "${target}" --all-features --release
              sh .github/scripts/freebsd-smoke.sh "target/${target}/release/dprint"
            else
              cargo build -p dprint -p test-process-plugin --locked --target "${target}"
              cargo test --locked --target "${target}" --all-features
              sh .github/scripts/freebsd-smoke.sh "target/${target}/debug/dprint"
            fi
      - name: Package FreeBSD release
        id: package
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: target/x86_64-unknown-freebsd/release
        run: |-
          zip dprint-x86_64-unknown-freebsd.zip dprint
          checksum=$(sha256sum dprint-x86_64-unknown-freebsd.zip)
          echo "ZIP_CHECKSUM=${checksum%% *}" >> "${GITHUB_OUTPUT}"
      - name: Upload FreeBSD artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: x86_64-unknown-freebsd-artifacts
          path: target/x86_64-unknown-freebsd/release/dprint-x86_64-unknown-freebsd.zip
          if-no-files-found: error
  ci:
    needs: [changes, format, library_boundaries, build, build_freebsd]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env: { code: "${{ case(contains(fromJSON('[\"cancelled\", \"failure\"]'), needs.*.result), '1', '0') }}" }
    steps: [run: 'exit "${code}"']
  draft_release:
    name: draft_release
    needs: [build, build_freebsd]
    if: 'startsWith(github.ref, ''refs/tags/'')'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Generate changelog
        id: changelog
        run: |-
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            echo "Collecting commits since ${previous_tag}"
            range="${previous_tag}..HEAD"
          else
            echo "No previous tag found -- using full history"
            range=HEAD
          fi
          commits="$(git log --reverse --pretty=format:%s "${range}")"
          {
            echo "changelog<<CHANGELOG_EOF"
            sed -E '/^$/d; /^(chore|refactor|ci)(\([^)]*\))?!?: /d; /^[0-9]+\.[0-9]+\.[0-9]+$/d; s/^/* /' <<< "${commits}"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Output checksums
        run: |-
          echo "dprint-x86_64-unknown-freebsd.zip: ${{ needs.build_freebsd.outputs.ZIP_CHECKSUM }}"
          echo "dprint-x86_64-apple-darwin.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_APPLE_DARWIN }}"
          echo "dprint-aarch64-apple-darwin.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_APPLE_DARWIN }}"
          echo "dprint-x86_64-pc-windows-msvc.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_PC_WINDOWS_MSVC }}"
          echo "dprint-x86_64-pc-windows-msvc-installer.exe: ${{ needs.build.outputs.INSTALLER_CHECKSUM_X86_64_PC_WINDOWS_MSVC }}"
          echo "dprint-aarch64-pc-windows-msvc.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_PC_WINDOWS_MSVC }}"
          echo "dprint-x86_64-unknown-linux-gnu.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_UNKNOWN_LINUX_GNU }}"
          echo "dprint-x86_64-unknown-linux-musl.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_UNKNOWN_LINUX_MUSL }}"
          echo "dprint-aarch64-unknown-linux-gnu.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_UNKNOWN_LINUX_GNU }}"
          echo "dprint-aarch64-unknown-linux-musl.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_UNKNOWN_LINUX_MUSL }}"
          echo "dprint-riscv64gc-unknown-linux-gnu.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_RISCV64GC_UNKNOWN_LINUX_GNU }}"
          echo "dprint-loongarch64-unknown-linux-gnu.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_LOONGARCH64_UNKNOWN_LINUX_GNU }}"
          echo "dprint-loongarch64-unknown-linux-musl.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_LOONGARCH64_UNKNOWN_LINUX_MUSL }}"
          echo "dprint-powerpc64le-unknown-linux-gnu.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_POWERPC64LE_UNKNOWN_LINUX_GNU }}"
          echo "dprint-powerpc64le-unknown-linux-musl.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_POWERPC64LE_UNKNOWN_LINUX_MUSL }}"
          echo "dprint-aarch64-linux-android.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_LINUX_ANDROID }}"
          echo "dprint-x86_64-linux-android.zip: ${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_LINUX_ANDROID }}"
      - name: Create SHASUMS256.txt file
        run: |-
          {
            echo "${{ needs.build_freebsd.outputs.ZIP_CHECKSUM }} dprint-x86_64-unknown-freebsd.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_APPLE_DARWIN }} dprint-x86_64-apple-darwin.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_APPLE_DARWIN }} dprint-aarch64-apple-darwin.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_PC_WINDOWS_MSVC }} dprint-x86_64-pc-windows-msvc.zip"
            echo "${{ needs.build.outputs.INSTALLER_CHECKSUM_X86_64_PC_WINDOWS_MSVC }} dprint-x86_64-pc-windows-msvc-installer.exe"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_PC_WINDOWS_MSVC }} dprint-aarch64-pc-windows-msvc.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_UNKNOWN_LINUX_GNU }} dprint-x86_64-unknown-linux-gnu.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_X86_64_UNKNOWN_LINUX_MUSL }} dprint-x86_64-unknown-linux-musl.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_UNKNOWN_LINUX_GNU }} dprint-aarch64-unknown-linux-gnu.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_AARCH64_UNKNOWN_LINUX_MUSL }} dprint-aarch64-unknown-linux-musl.zip"
            echo "${{ needs.build.outputs.ZIP_CHECKSUM_RISCV64GC_UNKNOWN_LINUX_GNU }} dprint-riscv64gc-unknown-linux-gnu.zip"
