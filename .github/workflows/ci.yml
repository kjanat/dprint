name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Release {0} · {1}', inputs.release_tag, inputs.target) || '' }}"
on:
  push:
    branches: [master, the-big-split]
    tags: ["*"]
    paths-ignore:
      - deployment/**
      - website/**
  # every pull request, so a stacked one (based on another's branch) is tested too
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string
      target:
        description: Rust target to build, or all
        default: x86_64-pc-windows-msvc
        required: true
        type: choice
        options:
          - all
          - x86_64-unknown-freebsd
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          - loongarch64-unknown-linux-musl
          - powerpc64le-unknown-linux-gnu
          - powerpc64le-unknown-linux-musl
          - aarch64-linux-android
          - x86_64-linux-android
permissions: { contents: read }
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    outputs:
      code: "${{ steps.filter.outputs.code }}"
      matrix: "${{ steps.select.outputs.matrix }}"
      source_sha: "${{ steps.select.outputs.source_sha }}"
      release: "${{ steps.select.outputs.release }}"
      release_tag: "${{ steps.select.outputs.release_tag }}"
    steps:
      - id: filter
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ github.event.pull_request.number }}"
        run: |
          code=true
          if [[ -n "${PR}" ]]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
            grep -qvE '^(deployment/.+|website/.+)$' <<< "${files}" || code=false
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
      - name: Checkout workflow configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select build targets and source
        id: select
        env:
          GH_TOKEN: "${{ github.token }}"
          INPUT_TARGET: "${{ inputs.target }}"
          INPUT_TAG: "${{ inputs.release_tag }}"
        run: |
          target="${INPUT_TARGET:-all}"
          matrix=$(jq -ce --arg target "${target}" 'map(select($target == "all" or .target == $target)) | if length == 0 then error("Unknown build target") else . end' .github/build-matrix.json)
          release=false
          release_tag=''
          source_sha="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            release_tag="${INPUT_TAG}"
            git check-ref-format "refs/tags/${release_tag}"
            ref=$(jq -rn --arg ref "refs/tags/${release_tag}" '$ref | @uri')
            source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ref}" --jq .sha)
            release=true
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release=true
          fi
          {
            echo "matrix=${matrix}"
            echo "source_sha=${source_sha}"
            echo "release=${release}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"
  format:
    name: Check formatting
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      LZMA_API_STATIC: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: kjanat/dprint-check@29c42153a7346f4d7315883ff7722cfe22cd510c # v3.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { key: format }
      - name: Check formatting with the current source
        run: cargo run -p dprint --locked -- check
  library_boundaries:
    name: Library boundaries
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { key: libraries }
      - name: Check crate ownership
        run: python3 .github/scripts/check-crate-boundaries.py
      - name: Check independent libraries
        run: |
          for package in dprint-configuration dprint-formatting dprint-async-runtime dprint-communication dprint-owned-child dprint-plugin-types dprint-process-plugin dprint-wasm-plugin; do
            cargo check --locked -p "${package}"
          done
      - name: Check host libraries and lightweight test fixtures
        run: |
          for package in dprint-host-api dprint-platform dprint-discovery dprint-config; do
            cargo check --locked -p "${package}" --all-targets
          done
          cargo check --locked -p dprint-config --no-default-features
          cargo check --locked -p dprint-plugin-host -p dprint-host -p dprint-lsp --all-targets
      - name: Check facade feature combinations
        run: |
          for features in '' formatting tracing wasm process communication async_runtime process,wasm,tracing; do
            cargo test --locked -p dprint-core --no-default-features --features "${features}"
          done
      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build renamed Wasm API and facade fixtures
        env: { RUSTFLAGS: "-C link-arg=--allow-undefined" }
        run: |
          for feature in direct facade; do
            cargo build --manifest-path crates/dprint-core/tests/fixtures/wasm-plugin/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "${feature}"
          done
  prepare_release:
    name: Prepare release
    needs: changes
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - name: Create release if missing
        env:
          RELEASE_TAG: "${{ needs.changes.outputs.release_tag }}"
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          if gh release view "${RELEASE_TAG}" --json id > /dev/null 2>&1; then
            echo "Using existing release ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" --verify-tag --draft --title "${RELEASE_TAG}" --generate-notes
          fi
  build:
    needs: [changes, prepare_release]
    if: >-
      !cancelled() && needs.changes.outputs.code == 'true' &&
      (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped')
    name: "${{ matrix.target }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: "${{ matrix.target == 'x86_64-unknown-freebsd' && 90 || 60 }}"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        include: "${{ fromJSON(needs.changes.outputs.matrix) }}"
    env:
      RELEASE_BUILD: "${{ needs.changes.outputs.release }}"
      RELEASE_TAG: "${{ needs.changes.outputs.release_tag }}"
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      LZMA_API_STATIC: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ needs.changes.outputs.source_sha }}" }
        if: '(((matrix.target != ''aarch64-unknown-linux-gnu'' && matrix.target != ''aarch64-unknown-linux-musl'') || github.ref == ''refs/heads/master'' || needs.changes.outputs.release == ''true'') && matrix.target == ''x86_64-unknown-linux-gnu'' && needs.changes.outputs.release != ''true'') || (((matrix.target != ''aarch64-unknown-linux-gnu'' && matrix.target != ''aarch64-unknown-linux-musl'') || github.ref == ''refs/heads/master'' || needs.changes.outputs.release == ''true'') && ((matrix.cross != ''true'' && matrix.musl_image == '''' && matrix.zigbuild_glibc == '''') || matrix.zigbuild_glibc != '''' || matrix.cross == ''true'' || matrix.musl_image != '''')) || (matrix.run_tests == ''true'' && needs.changes.outputs.release == ''true'' && ((matrix.cross != ''true'' && matrix.musl_image == '''' && matrix.zigbuild_glibc == '''') || matrix.cross == ''true'' || matrix.musl_image != '''')) || (matrix.target == ''x86_64-apple-darwin'' && needs.changes.outputs.release == ''true'' && ((matrix.cross != ''true'' && matrix.musl_image == '''' && matrix.zigbuild_glibc == '''') || matrix.cross == ''true'' || matrix.musl_image != '''')) || (matrix.target == ''x86_64-apple-darwin'' && needs.changes.outputs.release == ''true'' && matrix.zigbuild_glibc != '''') || (matrix.target == ''aarch64-apple-darwin'' && needs.changes.outputs.release == ''true'' && ((matrix.cross != ''true'' && matrix.musl_image == '''' && matrix.zigbuild_glibc == '''') || matrix.cross == ''true'' || matrix.musl_image != '''')) || (matrix.target == ''aarch64-apple-darwin'' && needs.changes.outputs.release == ''true'' && matrix.zigbuild_glibc != '''') || (matrix.target == ''x86_64-pc-windows-msvc'' && needs.changes.outputs.release == ''true'' && ((matrix.cross != ''true'' && matrix.musl_image == '''' && matrix.zigbuild_glibc == '''') || matrix.cross == ''true'' || matrix.musl_image != '''')) || (matrix.target == ''x86_64-pc-windows-msvc'' && needs.changes.outputs.release == ''true'' && matrix.zigbuild_glibc != 