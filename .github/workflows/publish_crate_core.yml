name: cargo publish core crate
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to publish, in dependency order
        type: string
        required: true
        default: dprint-configuration dprint-formatting dprint-async-runtime dprint-communication dprint-owned-child dprint-plugin-types dprint-process-plugin dprint-wasm-plugin dprint-core
permissions:
  id-token: write
  contents: read
jobs:
  rust:
    name: cargo publish core crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: "${{ secrets.GH_DPRINTBOT_PAT }}"
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
          PACKAGES: "${{ inputs.packages }}"
        run: |
          # Publish libraries before the facade that depends on them.
          read -r -a packages <<< "${PACKAGES}"
          for package in "${packages[@]}"; do
            cargo publish --locked -p "${package}"
          done
