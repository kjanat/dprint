name: Benchmark comment
on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
permissions: {}
jobs:
  comment:
    name: Comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { actions: read, contents: read, pull-requests: write }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-comment
          path: comment
          run-id: "${{ github.event.workflow_run.id }}"
          github-token: "${{ github.token }}"
      - name: Write the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { default: bench } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bench.ts`);
            await bench({ core, github, context }, ["comment", "comment/comment.md"]);
