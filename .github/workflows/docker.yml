name: Docker

on:
  workflow_call:
    inputs:
      tags:
        description: The image's tags (ex. `nightly`), one per line, pushed to ghcr.io/<owner>/dprint.
        required: true
        type: string
      release_tag:
        description: The release whose zips the image is built from. Without it, this run's artifacts.
        required: false
        type: string
        default: ""

permissions: { contents: read }

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, packages: write }
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { sparse-checkout: deployment/docker, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release_tag == ''
        with: { pattern: dprint-*-unknown-linux-musl, merge-multiple: true, path: zips }
      - name: Download the release's zips
        if: inputs.release_tag != ''
        run: gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'dprint-*-unknown-linux-musl.zip' --dir zips
      - name: Extract the binaries
        run: |
          set -euo pipefail
          for arch in amd64:x86_64 arm64:aarch64; do
            dir="deployment/docker/bin/${arch%%:*}"
            mkdir -p "${dir}"
            unzip -o "zips/dprint-${arch#*:}-unknown-linux-musl.zip" dprint -d "${dir}"
          done
      - name: Name the image
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dprint"
          {
            echo "name=${image}"
            echo 'tags<<EOF'
            grep -v '^[[:space:]]*$' <<< "${TAGS}" | sed "s|^|${image}:|"
            echo EOF
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deployment/docker
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
      - name: Run the image
        env: { IMAGE: "${{ steps.image.outputs.name }}" }
        run: |
          set -euo pipefail
          tag="$(grep -v '^[[:space:]]*$' <<< "${TAGS}" | head -n 1)"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "${platform}" "${IMAGE}:${tag}" --version
          done
