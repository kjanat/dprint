[workspace]
resolver = "3"
members  = ["crates/*"]
# excluded because this needs to be compiled as wasm to work
exclude  = ["crates/test-plugin"]

[workspace.package]
authors    = ["David Sherret <dsherret@gmail.com>"]
edition    = "2024"
repository = "https://github.com/kjanat/dprint"
license    = "MIT"

[workspace.dependencies]
kprint-async-runtime  = { path = "crates/kprint-async-runtime", version = "=0.1.0" }
kprint-communication  = { path = "crates/kprint-communication", version = "=0.1.0" }
kprint-config         = { path = "crates/kprint-config" }
kprint-configuration  = { path = "crates/kprint-configuration", version = "=0.1.0" }
kprint-discovery      = { path = "crates/kprint-discovery", version = "=0.1.0" }
kprint-formatting     = { path = "crates/kprint-formatting", version = "=0.1.0" }
kprint-git            = { path = "crates/kprint-git", version = "=0.1.0" }
kprint-host           = { path = "crates/kprint-host", version = "=0.1.0" }
kprint-host-api       = { path = "crates/kprint-host-api", version = "=0.1.0" }
kprint-lsp            = { path = "crates/kprint-lsp", version = "=0.1.0" }
kprint-owned-child    = { path = "crates/kprint-owned-child", version = "=0.1.0" }
kprint-platform       = { path = "crates/kprint-platform", version = "=0.1.0" }
kprint-plugin-host    = { path = "crates/kprint-plugin-host", version = "=0.1.0" }
kprint-plugin-types   = { path = "crates/kprint-plugin-types", version = "=0.1.0" }
kprint-process-plugin = { path = "crates/kprint-process-plugin", version = "=0.1.0" }
kprint-test-support   = { path = "crates/kprint-test-support", version = "=0.1.0" }
kprint-wasm-plugin    = { path = "crates/kprint-wasm-plugin", version = "=0.1.0" }

json-schema-sort.version          = "0.1"
json-schema-sort.default-features = false
tree-fucker.git                   = "https://github.com/kjanat/tree-fucker"
tree-fucker.rev                   = "b30f8c4a5fcb99916a044d135701687230dbda43"

anyhow                    = "1"
async-trait               = "0.1"
base64                    = "0.22"
boon                      = "0.6"
bumpalo                   = "3"
clap                      = "4"
clap_complete             = "4"
console                   = "0.16"
console_static_text       = "0.9"
crossbeam-channel         = "0.5"
crossterm                 = "0.27"                                       # Manually retest everything when bumping this crate.
deno_npmrc                = "0.9"
deno_semver               = "0.10"
deno_terminal             = "0.2"
dirs                      = "6"
dunce                     = "1"
file_test_runner          = "0.12"
flate2                    = "1"
fs3                       = "0.5"
futures                   = "0.3"
globset                   = "0.4"
hashbrown                 = "0.17"
indexmap.version          = "2.14"
indexmap.features         = ["serde"]
ipnet                     = "2.11"
jsonc-parser              = "0.32"
libc                      = "0.2"
once_cell                 = "1.21"
parking_lot               = "0.12"
path-clean                = "1.0"                                        # Keep this version for consistent output across platforms.
percent-encoding          = "2"
pretty_assertions         = "1"
quote                     = "1"
rand                      = "0.9"
rustc-hash                = "2"
rustls.version            = "0.23"
rustls.default-features   = false
rustls-native-certs       = "0.7"
rustls-pemfile            = "2.1"
schemars                  = "1.2"
serde.version             = "1"
serde.features            = ["derive"]
serde_json.version        = "1"
serde_json.features       = ["preserve_order"]
serde_path_to_error       = "0.1"
sha1                      = "0.10"
sha2                      = "0.10"
signal-hook               = "0.4"
similar                   = "2"
syn                       = "1"
sys_traits                = "0.1"
sysinfo.version           = "0.39"
sysinfo.default-features  = false
tar                       = "0.4"
tempfile                  = "3"
text-size                 = "1"
thiserror                 = "2"
tokio.version             = "1"
tokio.features            = ["macros", "rt", "rt-multi-thread", "time"]
tokio-util                = "0.7"
toml_edit                 = "0.25"
tower-lsp                 = "0.20"
twox-hash                 = "2"
unicode-width             = "0.2"
ureq.version              = "2"
ureq.default-features     = false
url                       = "2"
wasmi.version             = "2"
wasmi.default-features    = false
wasmtime.version          = "43"
wasmtime.default-features = false
webpki-roots              = "1"
which                     = "8"
winapi                    = "0.3"
winreg                    = "0.55"
zip                       = "2.4"

[patch.crates-io]
# unreleased fixes on top of 0.6.1
boon.git = "https://github.com/santhosh-tekuri/boon"
boon.rev = "b487e6a75097d8719b185486269c8723f0176ed7"

# Build release with debug symbols: cargo build --profile=release-with-debug
[profile.release-with-debug]
inherits = "release"
debug    = true
