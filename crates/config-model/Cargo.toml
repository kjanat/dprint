[package]
name        = "dprint-config-model"
version     = "0.1.0"
authors     = ["Kaj Kowalski <info@kajkowalski.nl>"]
edition     = { workspace = true }
description = "The model of dprint's configuration file: the types a configuration file is read into, and (with the `schema` feature) its JSON schema, generated from them."
repository  = { workspace = true }
license     = { workspace = true }
publish     = false

[package.metadata]
schema-id = "https://dprint.kjanat.dev/schemas/v0.json"

[dependencies]
anyhow              = { workspace = true, optional = true }
dprint-core         = { workspace = true }
indexmap            = { workspace = true }
percent-encoding    = { workspace = true, optional = true }
schemars            = { workspace = true, features = ["indexmap2", "preserve_order"], optional = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
serde_path_to_error = { workspace = true }
url                 = { workspace = true, optional = true }

[dev-dependencies]
boon              = { workspace = true }
pretty_assertions = { workspace = true }

[features]
default = []
# the JSON schema of the model, and composing the plugins' schemas into it
schema  = ["dep:anyhow", "dep:percent-encoding", "dep:schemars", "dep:url"]
