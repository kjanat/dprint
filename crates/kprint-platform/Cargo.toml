[package]
name                 = "kprint-platform"
version              = "0.1.0"
edition.workspace    = true
repository.workspace = true
license.workspace    = true

[dependencies]
kprint-async-runtime = { workspace = true }
kprint-git           = { workspace = true }
kprint-host-api      = { workspace = true }
kprint-owned-child   = { workspace = true }

tree-fucker = { workspace = true }

anyhow        = { workspace = true }
deno_terminal = { workspace = true }
fs3           = { workspace = true }
ipnet         = { workspace = true }
parking_lot   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
similar       = { workspace = true, features = ["inline"] }
sys_traits    = { workspace = true, features = ["real"] }
sysinfo       = { workspace = true, features = ["system"] }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["io-std"] }
tokio-util    = { workspace = true }
twox-hash     = { workspace = true }
url           = { workspace = true }
zip           = { workspace = true }

dirs.workspace      = true
dunce.workspace     = true
once_cell.workspace = true
rand.workspace      = true
which.workspace     = true

[dev-dependencies]
kprint-test-support         = { workspace = true }
pretty_assertions.workspace = true
sys_traits                  = { workspace = true, features = ["memory"] }
tempfile.workspace          = true

[target."cfg(windows)".dependencies]
winreg.workspace = true
