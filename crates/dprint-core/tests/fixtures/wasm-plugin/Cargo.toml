[package]
name    = "wasm-api-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
configuration = { package = "dprint-configuration", path = "../../../../dprint-configuration" }
legacy        = { package = "dprint-core", path = "../../..", default-features = false, features = ["wasm"], optional = true }
sdk           = { package = "dprint-wasm-plugin", path = "../../../../dprint-wasm-plugin", optional = true }

[features]
default = ["direct"]
direct  = ["dep:sdk"]
facade  = ["dep:legacy"]
