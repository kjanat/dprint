#:schema https://www.schemastore.org/cargo.json
#:tombi schema.strict = false

[package]
name        = "dprint-config"
version     = "0.1.0"
authors     = ["Kaj Kowalski <info@kajkowalski.nl>"]
edition     = { workspace = true }
description = "The model of dprint's configuration file: the types a configuration file is read into, and (with the `schema` feature) its JSON schema, generated from them."
repository  = { workspace = true }
license     = { workspace = true }
publish     = false

[package.metadata]
schema-id = "https://dprint.kjanat.dev/schemas/v0.json"

[dependencies]
dprint-host-api      = { workspace = true }
dprint-plugin-types  = { workspace = true }
thiserror            = { workspace = true }
toml_edit            = { workspace = true }
jsonc-parser         = { workspace = true, features = ["cst", "preserve_order"] }
json-schema-sort     = { workspace = true }
deno_terminal        = { workspace = true }
dprint-discovery     = { workspace = true }
dprint-platform      = { workspace = true }
anyhow               = { workspace = true, optional = false }                                              # idk what's wrong
dprint-configuration = { workspace = true }
indexmap             = { workspace = true }
percent-encoding     = { workspace = true, optional = false }
schemars             = { workspace = true, features = ["indexmap2", "preserve_order"], optional = false }
serde                = { workspace = true }
serde_json           = { workspace = true }
serde_path_to_error  = { workspace = true }
url                  = { workspace = true, optional = false }

[dev-dependencies]
boon                = { workspace = true }
dprint-test-support = { workspace = true }
pretty_assertions   = { workspace = true }
tempfile            = { workspace = true }

[features]
default = ["schema"]
# the JSON schema of the model, and composing the plugins' schemas into it
schema  = []
