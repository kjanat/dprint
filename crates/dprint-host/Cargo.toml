[package]
name                 = "dprint-host"
version              = "0.1.0"
edition.workspace    = true
repository.workspace = true
license.workspace    = true

[dependencies]
dprint-async-runtime      = { workspace = true }
dprint-config             = { workspace = true }
dprint-configuration      = { workspace = true }
dprint-discovery          = { workspace = true }
dprint-host-api.workspace = true
dprint-platform           = { workspace = true }
dprint-plugin-host        = { workspace = true }
dprint-plugin-types       = { workspace = true }

anyhow      = { workspace = true }
indexmap    = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sys_traits  = { workspace = true, features = ["real"] }
thiserror   = { workspace = true }
tokio       = { workspace = true, features = ["io-std"] }
tokio-util  = { workspace = true }

[dev-dependencies]
dprint-plugin-host  = { workspace = true, features = ["test-support"] }
dprint-test-support = { workspace = true, features = ["plugins"] }
sys_traits          = { workspace = true, features = ["memory"] }
