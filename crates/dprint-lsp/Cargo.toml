[package]
name                 = "dprint-lsp"
version              = "0.1.0"
edition.workspace    = true
repository.workspace = true
license.workspace    = true

[dependencies]
dprint-async-runtime  = { workspace = true }
dprint-config         = { workspace = true }
dprint-host           = { workspace = true }
dprint-platform       = { workspace = true }
dprint-plugin-host    = { workspace = true }
dprint-plugin-types   = { workspace = true }
dprint-process-plugin = { workspace = true }

anyhow           = { workspace = true }
jsonc-parser     = { workspace = true, features = ["cst", "preserve_order"] }
parking_lot      = { workspace = true }
percent-encoding = { workspace = true }
serde_json       = { workspace = true }
similar          = { workspace = true, features = ["inline"] }
text-size        = { workspace = true }
tokio            = { workspace = true, features = ["io-std"] }
tokio-util       = { workspace = true }
tower-lsp        = { workspace = true }
url              = { workspace = true }

[dev-dependencies]
dprint-test-support         = { workspace = true }
path-clean.workspace        = true
pretty_assertions.workspace = true
sys_traits                  = { workspace = true, features = ["memory"] }
tempfile.workspace          = true
