[package]
name        = "dprint"
version     = "0.59.0-kjanat"
authors     = ["Kaj Kowalski <info@kajkowalski.nl>", "dprint code formatting <david@dprint.dev>"]
edition     = { workspace = true }
description = "Binary for dprint code formatter—a pluggable and configurable code formatting platform."
repository  = { workspace = true }
license     = { workspace = true }
keywords    = ["code-formatter", "formatter"]
categories  = ["development-tools"]
default-run = "dprint"

[dependencies]
anyhow              = { workspace = true }
base64              = { workspace = true }
clap                = { workspace = true }
clap_complete       = { workspace = true }
console_static_text = { workspace = true }
crossterm           = { workspace = true }
deno_npmrc          = { workspace = true }
deno_semver         = { workspace = true }
deno_terminal       = { workspace = true }
dirs                = { workspace = true }
dprint-config-model = { workspace = true, features = ["schema"] }
dprint-core         = { workspace = true, default-features = true, features = ["process", "wasm"] }
dunce               = { workspace = true }
flate2              = { workspace = true }
fs3                 = { workspace = true }
globset             = { workspace = true }
ignore              = { workspace = true }
indexmap            = { workspace = true }
ipnet               = { workspace = true }
jsonc-parser        = { workspace = true, features = ["cst", "preserve_order"] }
monch               = { workspace = true }
once_cell           = { workspace = true }
parking_lot         = { workspace = true }
percent-encoding    = { workspace = true }
rand                = { workspace = true }
rkyv                = { workspace = true }
rustls              = { workspace = true, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = { workspace = true }
rustls-pemfile      = { workspace = true }
schemars            = { workspace = true, features = ["preserve_order"] }
serde               = { workspace = true }
serde_json          = { workspace = true }
sha2                = { workspace = true }
similar             = { workspace = true, features = ["inline"] }
sys_traits          = { workspace = true, features = ["real"] }
sysinfo             = { workspace = true, features = ["system"] }
tar                 = { workspace = true }
text-size           = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true, features = ["io-std"] }
tokio-util          = { workspace = true }
toml_edit           = { workspace = true }
tower-lsp           = { workspace = true }
tree-fucker         = { workspace = true }
twox-hash           = { workspace = true }
ureq                = { workspace = true, features = ["gzip", "socks-proxy", "tls"] }
url                 = { workspace = true }
wasmi               = { workspace = true, features = ["auto-dispatch", "simd", "stable", "std", "validate"] }
webpki-roots        = { workspace = true }
which               = { workspace = true }
zip                 = { workspace = true }

[dev-dependencies]
boon              = { workspace = true }
path-clean        = { workspace = true }
pretty_assertions = { workspace = true }
sys_traits        = { workspace = true, features = ["memory"] }
tempfile          = { workspace = true }

[target."cfg(any(target_arch = \"powerpc64\", target_arch = \"loongarch64\", target_os = \"android\"))".dependencies.wasmtime]
workspace = true
features  = ["addr2line", "anyhow", "cranelift", "demangle", "parallel-compilation", "pulley", "runtime", "std"]

# wasm plugin runtime (wasmtime). default features are disabled to keep the
# binary small — we only need to compile and run modules synchronously;
# component-model, async, winch, the wat parser, wasm GC, the on-disk cache and
# the pooling allocator are all unused. `parallel-compilation` is kept: without
# it Cranelift compiles a module's functions one at a time, which made the
# uncached "Compiling <plugin>" step ~3.5x slower on a 4 core machine.
# most targets: native Cranelift codegen.
[target."cfg(not(any(target_arch = \"powerpc64\", target_arch = \"loongarch64\", target_os = \"android\")))".dependencies]
wasmtime = { workspace = true, features = ["addr2line", "anyhow", "cranelift", "demangle", "parallel-compilation", "runtime", "std"] }

[target."cfg(target_os = \"freebsd\")".dependencies]
libc = { workspace = true }

[target."cfg(unix)".dependencies]
signal-hook = { workspace = true }

[target."cfg(windows)".dependencies]
winreg = { workspace = true }
