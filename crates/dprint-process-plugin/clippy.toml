#:tombi toml-version = "v1.1.0"

disallowed-methods = [
  {
    path   = "std::process::Command::spawn",
    reason = """
    Spawn processes with dprint_owned_child::OwnedChild, which kills them and what they start when they're dropped.
    Waiting in place with `output` or `status` is fine.
    """
  },
]
